openapi: 3.1.0
info:
  title: API de conversaciones Serenity
  description: "\nAPI de solo lectura con el histórico de conversaciones de los alumnos\
    \ con los agentes de Serenity Star.\n\n**Fase 0:** contrato provisional. El servidor\
    \ de prueba responde con datos ficticios.\n\n## Autenticación\nOAuth2 *client\
    \ credentials*. Todas las rutas, salvo `/v1/health`, requieren un token con el\
    \ scope\n`conversations:read` en la cabecera `Authorization: Bearer <token>`.\n\
    \n## Identificación del alumno\nEl alumno se identifica por **email + vertical**.\
    \ El email se envía siempre en el cuerpo de la petición,\nnunca en la URL. Se\
    \ compara sin distinguir mayúsculas y minúsculas.\n\n## Convenciones\n- Fechas\
    \ en UTC, formato ISO 8601 con sufijo `Z` (p. ej. `2026-11-24T09:10:49Z`).\n-\
    \ Los mensajes del agente están en **Markdown**: el aula debe renderizarlo.\n\
    - Paginación con cursor opaco: se envía el `next_cursor` recibido en la petición\
    \ siguiente, con los\n  mismos criterios. `next_cursor: null` indica la última\
    \ página.\n- Frescura: cada respuesta incluye `synced_at` (última sincronización\
    \ con Serenity) y `stale`\n  (`true` si no se pudo refrescar antes de responder).\n\
    - Errores en formato `application/problem+json` (RFC 9457). Los errores de validación\
    \ (`422`) incluyen\n  la lista `errors` con la ubicación de cada campo erróneo.\n\
    - Se pueden añadir campos nuevos a las respuestas sin cambiar de versión: el cliente\
    \ debe ignorar los\n  campos que no conozca.\n"
  version: 0.1.0
servers:
- url: https://api.example.com
  description: 'Pendiente: dominio definitivo'
paths:
  /v1/health:
    get:
      tags:
      - Sistema
      summary: Estado del servicio
      description: No requiere autenticación.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/verticals:
    get:
      tags:
      - Catálogo
      summary: Verticales disponibles
      description: Valores válidos del campo `vertical`. Se añadirán verticales nuevas
        sin cambiar el contrato.
      operationId: listVerticals
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerticalList'
              example:
                items:
                - code: idiomas
                  name: Idiomas
                - code: marketing-digital
                  name: Marketing digital
                - code: programacion
                  name: Programación
                - code: sanidad
                  name: Sanidad
        '401':
          description: Falta el token de acceso, ha caducado o no es válido.
          headers:
            WWW-Authenticate:
              description: Esquema de autenticación requerido.
              schema:
                type: string
                example: Bearer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.example.com/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Falta el token de acceso o no es válido.
                instance: /v1/verticals
        '403':
          description: El token no tiene el scope `conversations:read`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.example.com/problems/forbidden
                title: Forbidden
                status: 403
                detail: El token no tiene el scope conversations:read.
                instance: /v1/verticals
        '429':
          description: Se ha superado el límite de peticiones. Reintentar tras los
            segundos indicados en `Retry-After`.
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.example.com/problems/rate-limited
                title: Too Many Requests
                status: 429
                detail: Demasiadas peticiones.
                instance: /v1/verticals
      security:
      - oauth2:
        - conversations:read
  /v1/students/conversations/search:
    post:
      tags:
      - Conversaciones
      summary: Conversaciones de un alumno en una vertical
      description: 'Devuelve las conversaciones del alumno, sin mensajes, ordenadas
        por última actividad descendente.


        Antes de responder se consulta Serenity para incluir la actividad más reciente
        del alumno (como mucho una vez por minuto y alumno). Si Serenity no responde,
        se devuelven los datos guardados con `stale: true`.


        Un alumno sin conversaciones devuelve `200` con `items` vacío, no `404`.


        El email va en el cuerpo, y no en la URL, para que no quede registrado en
        los logs.'
      operationId: searchStudentConversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationSearchRequest'
            examples:
              basica:
                summary: Búsqueda básica
                value:
                  email: alumna.ejemplo@example.com
                  vertical: idiomas
              filtrada:
                summary: Abiertas con actividad desde una fecha
                value:
                  email: alumna.ejemplo@example.com
                  vertical: idiomas
                  last_activity_from: '2026-11-20T00:00:00Z'
                  open: true
                  limit: 10
              siguiente_pagina:
                summary: Página siguiente
                value:
                  email: alumna.ejemplo@example.com
                  vertical: idiomas
                  limit: 2
                  cursor: eyJlIjogIjIwMjYtMTEtMThUMTY6MDI6NDkrMDA6MDAiLCAiaSI6ICIzZjZjMmExMC04YjRlLTRkMjEtOWM3YS0xZTJmM2E0YjVjMDIifQ
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSearchResponse'
              examples:
                primera_pagina:
                  summary: Primera página con más resultados
                  value:
                    items:
                    - id: 3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c01
                      vertical: idiomas
                      title: Diferencia entre present perfect y past simple
                      start_date: '2026-11-24T09:10:00Z'
                      end_date: '2026-11-24T09:11:38Z'
                      open: true
                      message_count: 5
                    - id: 3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c02
                      vertical: idiomas
                      title: Corrección de un email formal en inglés
                      start_date: '2026-11-18T16:02:00Z'
                      end_date: '2026-11-18T16:02:49Z'
                      open: false
                      message_count: 3
                    next_cursor: eyJlIjogIjIwMjYtMTEtMThUMTY6MDI6NDkrMDA6MDAiLCAiaSI6ICIzZjZjMmExMC04YjRlLTRkMjEtOWM3YS0xZTJmM2E0YjVjMDIifQ
                    synced_at: '2026-11-24T10:00:00Z'
                    stale: false
                ultima_pagina:
                  summary: Última página
                  value:
                    items:
                    - id: 3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c03
                      vertical: idiomas
                      title: Vocabulario para una entrevista de trabajo
                      start_date: '2026-11-10T11:30:00Z'
                      end_date: '2026-11-10T11:31:38Z'
                      open: false
                      message_count: 5
                    next_cursor: null
                    synced_at: '2026-11-24T10:00:00Z'
                    stale: false
                sin_refrescar:
                  summary: 'Serenity no respondió: datos guardados'
                  value:
                    items:
                    - id: 3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c01
                      vertical: idiomas
                      title: Diferencia entre present perfect y past simple
                      start_date: '2026-11-24T09:10:00Z'
                      end_date: '2026-11-24T09:11:38Z'
                      open: true
                      message_count: 5
                    next_cursor: null
                    synced_at: '2026-11-24T09:40:00Z'
                    stale: true
                sin_conversaciones:
                  summary: Alumno sin conversaciones
                  value:
                    items: []
                    next_cursor: null
                    synced_at: null
                    stale: false
        '401':
          description: Falta el token de acceso, ha caducado o no es válido.
          headers:
            WWW-Authenticate:
              description: Esquema de autenticación requerido.
              schema:
                type: string
                example: Bearer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.example.com/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Falta el token de acceso o no es válido.
                instance: /v1/students/conversations/search
        '403':
          description: El token no tiene el scope `conversations:read`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.example.com/problems/forbidden
                title: Forbidden
                status: 403
                detail: El token no tiene el scope conversations:read.
                instance: /v1/students/conversations/search
        '422':
          description: La petición no supera la validación.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.example.com/problems/validation-error
                title: Unprocessable Content
                status: 422
                detail: La petición no es válida.
                instance: /v1/students/conversations/search
                errors:
                - pointer: /email
                  message: value is not a valid email address
        '429':
          description: Se ha superado el límite de peticiones. Reintentar tras los
            segundos indicados en `Retry-After`.
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.example.com/problems/rate-limited
                title: Too Many Requests
                status: 429
                detail: Demasiadas peticiones.
                instance: /v1/students/conversations/search
      security:
      - oauth2:
        - conversations:read
  /v1/conversations/{conversation_id}:
    get:
      tags:
      - Conversaciones
      summary: Conversación con mensajes y feedback
      description: 'Si la conversación está abierta y la copia guardada no es reciente,
        se refresca desde Serenity antes de responder. Si Serenity no responde, se
        devuelve la copia guardada con `stale: true`.


        Los mensajes del agente (`sender: bot`) están en Markdown.'
      operationId: getConversation
      security:
      - oauth2:
        - conversations:read
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
              example:
                id: 3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c01
                vertical: idiomas
                title: Diferencia entre present perfect y past simple
                start_date: '2026-11-24T09:10:00Z'
                end_date: '2026-11-24T09:11:38Z'
                open: true
                message_count: 5
                synced_at: '2026-11-24T10:00:00Z'
                stale: false
                messages:
                - id: 00000000-0000-0000-0000-000000000000
                  seq: 0
                  sender: bot
                  type: text
                  content: ¡Hola! Soy tu tutor de idiomas. ¿En qué puedo ayudarte
                    hoy?
                  created_at: '2026-11-24T09:10:00Z'
                  is_welcome: true
                  canceled_by_client: false
                  is_interruption: false
                  attachments: []
                  feedback: null
                - id: 3f6c2a10-8b4e-4d21-9c7a-000000000001
                  seq: 1
                  sender: user
                  type: text
                  content: ¿Cuándo uso el present perfect en lugar del past simple?
                  created_at: '2026-11-24T09:10:40Z'
                  is_welcome: false
                  canceled_by_client: false
                  is_interruption: false
                  attachments: []
                  feedback: null
                - id: 3f6c2a10-8b4e-4d21-9c7a-000000000002
                  seq: 2
                  sender: bot
                  type: text
                  content: 'Usa el **present perfect** cuando la acción tiene relación
                    con el presente:


                    - *I have lost my keys* (aún no las tengo).

                    - *I lost my keys yesterday* (momento terminado: **past simple**).


                    Pista: si aparece un momento concreto del pasado (*yesterday*,
                    *in 2020*), usa past simple.'
                  created_at: '2026-11-24T09:10:49Z'
                  is_welcome: false
                  canceled_by_client: false
                  is_interruption: false
                  attachments: []
                  feedback:
                    is_positive: true
                    comment: Muy claro, gracias
                    created_at: '2026-11-24T09:12:30Z'
                - id: 3f6c2a10-8b4e-4d21-9c7a-000000000003
                  seq: 3
                  sender: user
                  type: text
                  content: ¿Y con *for* y *since*?
                  created_at: '2026-11-24T09:11:29Z'
                  is_welcome: false
                  canceled_by_client: false
                  is_interruption: false
                  attachments: []
                  feedback: null
                - id: 3f6c2a10-8b4e-4d21-9c7a-000000000004
                  seq: 4
                  sender: bot
                  type: text
                  content: 'Con *for* y *since* se usa el present perfect para algo
                    que empezó en el pasado y continúa:


                    | Expresión | Ejemplo |

                    |---|---|

                    | for + duración | *I have lived here for three years* |

                    | since + punto de inicio | *I have lived here since 2023* |'
                  created_at: '2026-11-24T09:11:38Z'
                  is_welcome: false
                  canceled_by_client: false
                  is_interruption: false
                  attachments: []
                  feedback: null
        '401':
          description: Falta el token de acceso, ha caducado o no es válido.
          content:
            application/problem+json:
              example:
                type: https://api.example.com/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Falta el token de acceso o no es válido.
                instance: /v1/conversations/3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c01
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: Esquema de autenticación requerido.
              schema:
                type: string
                example: Bearer
        '403':
          description: El token no tiene el scope `conversations:read`.
          content:
            application/problem+json:
              example:
                type: https://api.example.com/problems/forbidden
                title: Forbidden
                status: 403
                detail: El token no tiene el scope conversations:read.
                instance: /v1/conversations/3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c01
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: La conversación no existe.
          content:
            application/problem+json:
              example:
                type: https://api.example.com/problems/not-found
                title: Not Found
                status: 404
                detail: No existe la conversación.
                instance: /v1/conversations/3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c01
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: La petición no supera la validación.
          content:
            application/problem+json:
              example:
                type: https://api.example.com/problems/validation-error
                title: Unprocessable Content
                status: 422
                detail: La petición no es válida.
                instance: /v1/conversations/3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c01
                errors:
                - pointer: path/conversation_id
                  message: Input should be a valid UUID
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Se ha superado el límite de peticiones. Reintentar tras los
            segundos indicados en `Retry-After`.
          content:
            application/problem+json:
              example:
                type: https://api.example.com/problems/rate-limited
                title: Too Many Requests
                status: 429
                detail: Demasiadas peticiones.
                instance: /v1/conversations/3f6c2a10-8b4e-4d21-9c7a-1e2f3a4b5c01
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              description: Segundos que hay que esperar antes de reintentar.
              schema:
                type: integer
                example: 30
components:
  schemas:
    Attachment:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
          description: Identificador del adjunto en Serenity.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Nombre del archivo.
          examples:
          - temario.pdf
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
          description: Tipo MIME.
          examples:
          - application/pdf
      additionalProperties: true
      type: object
      title: Attachment
      description: 'Conocimiento adjunto a un mensaje (`attachedVolatileKnowledges`
        en Serenity).


        La forma exacta está pendiente de confirmar: pueden aparecer campos adicionales.'
    ConversationDetail:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        vertical:
          type: string
          maxLength: 50
          minLength: 1
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          title: Vertical
          description: Código de la vertical (slug en minúsculas). Los valores válidos
            se obtienen de `GET /v1/verticals`.
          examples:
          - idiomas
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Título generado automáticamente por Serenity (unos 50 caracteres
            como máximo).
        start_date:
          type: string
          format: date-time
          title: Start Date
          description: Inicio de la conversación.
        end_date:
          type: string
          format: date-time
          title: End Date
          description: 'Última actividad: fecha del último mensaje. Cambia mientras
            la conversación siga abierta.'
        open:
          type: boolean
          title: Open
          description: Si la conversación sigue abierta (se cierra tras 24 h sin actividad).
        message_count:
          type: integer
          minimum: 0.0
          title: Message Count
          description: Número de mensajes, incluido el de bienvenida.
        synced_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Synced At
          description: Momento de la última sincronización con Serenity de los datos
            devueltos. `null` si nunca se ha sincronizado (por ejemplo, un alumno
            sin conversaciones).
        stale:
          type: boolean
          title: Stale
          description: '`true` si no se pudo refrescar desde Serenity antes de responder
            y los datos pueden no incluir la actividad más reciente.'
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          title: Messages
          description: Mensajes en orden cronológico.
      additionalProperties: false
      type: object
      required:
      - id
      - vertical
      - title
      - start_date
      - end_date
      - open
      - message_count
      - synced_at
      - stale
      - messages
      title: ConversationDetail
    ConversationSearchRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Email del alumno. Se compara sin distinguir mayúsculas y minúsculas.
          examples:
          - alumna.ejemplo@example.com
        vertical:
          type: string
          maxLength: 50
          minLength: 1
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          title: Vertical
          description: Código de la vertical (slug en minúsculas). Los valores válidos
            se obtienen de `GET /v1/verticals`.
          examples:
          - idiomas
        last_activity_from:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Activity From
          description: Solo conversaciones cuya última actividad (`end_date`) es igual
            o posterior a esta fecha. Debe incluir zona horaria.
        last_activity_to:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Activity To
          description: Solo conversaciones cuya última actividad (`end_date`) es anterior
            a esta fecha. Debe incluir zona horaria.
        open:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Open
          description: '`true`: solo abiertas; `false`: solo cerradas; omitido: todas.'
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          description: Número máximo de resultados por página.
          default: 20
        cursor:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Cursor
          description: Cursor opaco devuelto en `next_cursor` de la página anterior.
            Se debe repetir la búsqueda con los mismos criterios.
      additionalProperties: false
      type: object
      required:
      - email
      - vertical
      title: ConversationSearchRequest
      description: Criterios de búsqueda. El email va en el cuerpo para que no quede
        en los logs de las URL.
    ConversationSearchResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ConversationSummary'
          type: array
          title: Items
          description: Conversaciones ordenadas por última actividad, de la más reciente
            a la más antigua.
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Cursor de la página siguiente; `null` si no hay más.
        synced_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Synced At
          description: Momento de la última sincronización con Serenity de los datos
            devueltos. `null` si nunca se ha sincronizado (por ejemplo, un alumno
            sin conversaciones).
        stale:
          type: boolean
          title: Stale
          description: '`true` si no se pudo refrescar desde Serenity antes de responder
            y los datos pueden no incluir la actividad más reciente.'
      additionalProperties: false
      type: object
      required:
      - items
      - next_cursor
      - synced_at
      - stale
      title: ConversationSearchResponse
    ConversationSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        vertical:
          type: string
          maxLength: 50
          minLength: 1
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          title: Vertical
          description: Código de la vertical (slug en minúsculas). Los valores válidos
            se obtienen de `GET /v1/verticals`.
          examples:
          - idiomas
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Título generado automáticamente por Serenity (unos 50 caracteres
            como máximo).
        start_date:
          type: string
          format: date-time
          title: Start Date
          description: Inicio de la conversación.
        end_date:
          type: string
          format: date-time
          title: End Date
          description: 'Última actividad: fecha del último mensaje. Cambia mientras
            la conversación siga abierta.'
        open:
          type: boolean
          title: Open
          description: Si la conversación sigue abierta (se cierra tras 24 h sin actividad).
        message_count:
          type: integer
          minimum: 0.0
          title: Message Count
          description: Número de mensajes, incluido el de bienvenida.
      additionalProperties: false
      type: object
      required:
      - id
      - vertical
      - title
      - start_date
      - end_date
      - open
      - message_count
      title: ConversationSummary
    Health:
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          title: Status
          description: '`degraded` si la API responde pero la sincronización con Serenity
            está retrasada.'
        version:
          type: string
          title: Version
          examples:
          - 0.1.0
        time:
          type: string
          format: date-time
          title: Time
      additionalProperties: false
      type: object
      required:
      - status
      - version
      - time
      title: Health
    Message:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: 'Identificador del mensaje. El de bienvenida es siempre `00000000-0000-0000-0000-000000000000`:
            úsese junto con el id de la conversación.'
        seq:
          type: integer
          minimum: 0.0
          title: Seq
          description: Posición del mensaje en la conversación, empezando en 0.
        sender:
          $ref: '#/components/schemas/Sender'
          description: '`user`: el alumno; `bot`: el agente.'
        type:
          type: string
          title: Type
          description: Tipo de contenido. Hoy siempre `text`.
          examples:
          - text
        content:
          type: string
          title: Content
          description: Contenido en Markdown. El aula debe renderizarlo.
        created_at:
          type: string
          format: date-time
          title: Created At
        is_welcome:
          type: boolean
          title: Is Welcome
          description: '`true` en el mensaje de bienvenida del agente.'
        canceled_by_client:
          type: boolean
          title: Canceled By Client
          description: El alumno canceló la generación de la respuesta.
        is_interruption:
          type: boolean
          title: Is Interruption
          description: El mensaje interrumpió una respuesta en curso.
        attachments:
          items:
            $ref: '#/components/schemas/Attachment'
          type: array
          title: Attachments
        feedback:
          anyOf:
          - $ref: '#/components/schemas/MessageFeedback'
          - type: 'null'
          description: Valoración del alumno. Solo en mensajes `bot`; `null` si no
            hay.
      additionalProperties: false
      type: object
      required:
      - id
      - seq
      - sender
      - type
      - content
      - created_at
      - is_welcome
      - canceled_by_client
      - is_interruption
      title: Message
    MessageFeedback:
      properties:
        is_positive:
          type: boolean
          title: Is Positive
          description: '`true`: valoración positiva; `false`: negativa.'
        comment:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Comment
          description: Comentario opcional del alumno.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Fecha de la valoración. No cambia si el alumno modifica la
            valoración después.
      additionalProperties: false
      type: object
      required:
      - is_positive
      - created_at
      title: MessageFeedback
    Problem:
      properties:
        type:
          type: string
          title: Type
          description: URI que identifica el tipo de error.
          default: about:blank
          examples:
          - https://api.example.com/problems/not-found
        title:
          type: string
          title: Title
          description: Resumen del tipo de error.
          examples:
          - Not Found
        status:
          type: integer
          title: Status
          description: Código HTTP.
          examples:
          - 404
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: Explicación de este caso concreto.
        instance:
          anyOf:
          - type: string
          - type: 'null'
          title: Instance
          description: Ruta de la petición que falló.
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ValidationIssue'
            type: array
          - type: 'null'
          title: Errors
          description: 'Solo en 422: errores de validación.'
      additionalProperties: true
      type: object
      required:
      - title
      - status
      title: Problem
      description: Error en formato `application/problem+json` (RFC 9457).
    Sender:
      type: string
      enum:
      - user
      - bot
      title: Sender
    ValidationIssue:
      properties:
        pointer:
          type: string
          title: Pointer
          description: Ubicación del campo erróneo (JSON Pointer para el cuerpo, o
            `query`/`path` + nombre).
          examples:
          - /email
        message:
          type: string
          title: Message
          examples:
          - value is not a valid email address
      additionalProperties: false
      type: object
      required:
      - pointer
      - message
      title: ValidationIssue
    Vertical:
      properties:
        code:
          type: string
          maxLength: 50
          minLength: 1
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          title: Code
          description: Código de la vertical (slug en minúsculas). Los valores válidos
            se obtienen de `GET /v1/verticals`.
          examples:
          - idiomas
        name:
          type: string
          title: Name
          description: Nombre legible de la vertical.
          examples:
          - Idiomas
      additionalProperties: false
      type: object
      required:
      - code
      - name
      title: Vertical
    VerticalList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Vertical'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - items
      title: VerticalList
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'OAuth2 client credentials. Se solicita un token al endpoint de
        tokens con el `client_id` y `client_secret` entregados a IRICOM y se envía
        en la cabecera `Authorization: Bearer <token>`.'
      flows:
        clientCredentials:
          scopes:
            conversations:read: Lectura de conversaciones de alumnos
          tokenUrl: https://auth.example.com/oauth2/token
tags:
- name: Conversaciones
  description: Consulta de conversaciones de los alumnos.
- name: Catálogo
  description: Valores de referencia.
- name: Sistema
  description: Estado del servicio.
